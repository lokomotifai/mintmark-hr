schema_version: 1
type_name: performance_note
id_prefix: PRF
order: 5
fields:
  - {name: performance_note_id, type: str, generator: seq_id, pii_label: none}
  - name: employee_id
    type: ref
    generator: seq_id
    ref: {parent: employee, counts: [0, 1], weights: ["0.30", "0.70"]}
    pii_label: none
  - name: author_role
    type: enum
    generator: enum_weighted
    params:
      values: [yonetici, ik_is_ortagi]
      weights: ["0.7", "0.3"]
    pii_label: none
  - {name: created_ts, type: datetime, generator: datetime_window, pii_label: none}
  - {name: body, type: doc, generator: "grammar:performance_notes", pii_label: none}
