schema_version: 1
type_name: hr_request_eval
id_prefix: HRQE
order: 10
fields:
  - {name: hr_request_eval_id, type: str, generator: seq_id, pii_label: none}
  - name: employee_id
    type: ref
    generator: seq_id
    ref: {parent: employee, counts: [1], weights: ["1"]}
    pii_label: none
  - name: channel
    type: enum
    generator: enum_weighted
    params:
      values: [portal, eposta, telefon]
      weights: ["0.5", "0.35", "0.15"]
    pii_label: none
  - {name: created_ts, type: datetime, generator: datetime_window, pii_label: none}
  - {name: body, type: doc, generator: "grammar:hr_requests_eval", pii_label: none}
