entries:
- id: perf_cycle
  weight: '0.55'
  text: 'Performans donemi degerlendirme notu. Calisan {entity:PERSON}, sicil {field:performance_note.employee_id},
    kayit {field:performance_note.author_role} tarafindan girildi. Donem hedeflerinin (tamami|buyuk bolumu|bir
    kismi) karsilandi. (Ekip ici isbirligi|Teslim disiplini|Musteri geri bildirimi) olumlu degerlendirildi.
    Gelisim alani olarak (raporlama|onceliklendirme|paydas iletisimi) belirlendi. [?0.4: Bir sonraki donem
    icin {entity:ORG} ile ortak yurutulen calismada gorev verilmesi kararlastirildi.] Not dosyaya islendi.'
- id: perf_checkin
  weight: '0.45'
  text: 'Ara degerlendirme gorusmesi notu. Calisan {entity:PERSON} ile {field:performance_note.author_role}
    arasinda yapilan gorusme kayda gecirildi. Yuruttugu isler (planlandigi gibi|kismi gecikmeyle) ilerliyor.
    Calisanin talebi uzerine (egitim butcesi|mentorluk|rol genisletme) gundeme alindi. [?0.3: Iletisim icin
    {id:EMAIL} adresi guncellendi.] [?special: Calisan, {entity:HEALTH} nedeniyle son donemde esnek calisma
    duzeninden yararlandigini belirtti.] Gorusme kaydi tamamlandi.'
