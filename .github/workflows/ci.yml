# Required checks. Every job here runs offline after dependency bootstrap,
# against the core wheel vendored under vendor/. Any job needing network at run
# time belongs in core-pin.yml, labeled as such.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: packcheck, tests, prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Verify the vendored core before trusting it
        run: |
          cd vendor && shasum -a 256 -c CHECKSUMS
      - run: uv sync --locked
      - name: Conformance run against the pinned core
        run: uv run mintmark packcheck .
      - run: uv run pytest -ra
      - run: uv run python tools/mdlint.py .

  canary:
    name: private-corpus canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # The canary is never committed. A missing secret fails this step by design.
      #
      # The one exception is Dependabot, which GitHub does not give repository
      # secrets to. The scan is skipped there and nowhere else, and the job
      # itself always runs and always reports: it is a required status check, and
      # a skipped job leaves that check unreported, which blocks the pull request
      # forever.
      #
      # The condition names the actor rather than testing whether the secret is
      # empty. A control that disables itself the moment its input goes missing
      # is not a control.
      - name: Scan tree for private-corpus canary
        if: github.actor != 'dependabot[bot]'
        env:
          MINTMARK_CANARY: ${{ secrets.MINTMARK_CANARY }}
        run: uv run python tools/canary.py .
      - name: Record why the scan was skipped
        if: github.actor == 'dependabot[bot]'
        run: |
          echo "Skipped: repository secrets are not available to Dependabot," >> "$GITHUB_STEP_SUMMARY"
          echo "so the canary cannot be supplied here. This branch changes only" >> "$GITHUB_STEP_SUMMARY"
          echo "the lockfile and workflow pins, and the tree is scanned on the" >> "$GITHUB_STEP_SUMMARY"
          echo "push to main that follows the merge." >> "$GITHUB_STEP_SUMMARY"
