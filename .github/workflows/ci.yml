# Required checks. Every job here runs offline after dependency bootstrap,
# against the core wheel vendored under vendor/. Any job needing network at run
# time belongs in core-pin.yml, labeled as such.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: packcheck, tests, prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"
      - name: Verify the vendored core before trusting it
        run: |
          cd vendor && shasum -a 256 -c CHECKSUMS
      - run: uv sync --locked
      - name: Conformance run against the pinned core
        run: uv run mintmark packcheck .
      - run: uv run pytest -ra
      - run: uv run python tools/mdlint.py .

  canary:
    name: private-corpus canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv sync --locked

      # Pull-request code never receives the private canary. The real scan runs
      # only after protected main accepts the revision; PRs exercise the
      # scanner's fail-closed tripwire without a secret.
      - name: Build final reference artifacts before the release gate
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          pack="$(awk '/^name:/ {print $2; exit}' pack.yaml)"
          version="$(awk '/^version:/ {print $2; exit}' pack.yaml)"
          mkdir -p dist
          for spec in workforce-baseline:20261101 pii-eval:20261102; do
            recipe="${spec%%:*}"
            seed="${spec##*:}"
            output="dist/$recipe"
            artifact="dist/$pack-$version-$recipe.tar.gz"
            uv run mintmark mint --pack . --recipe "$recipe" --seed "$seed" --out "$output"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
              --numeric-owner -czf "$artifact" -C dist "$recipe"
            test -s "$artifact"
          done

      - name: Scan source tree and final release artifacts
        if: github.event_name == 'push'
        env:
          MINTMARK_CANARY: ${{ secrets.MINTMARK_CANARY }}
        run: |
          set -euo pipefail
          pack="$(awk '/^name:/ {print $2; exit}' pack.yaml)"
          version="$(awk '/^version:/ {print $2; exit}' pack.yaml)"
          artifacts=(
            "dist/$pack-$version-workforce-baseline.tar.gz"
            "dist/$pack-$version-pii-eval.tar.gz"
          )
          for artifact in "${artifacts[@]}"; do test -s "$artifact"; done
          uv run python tools/canary.py . "${artifacts[@]}"
          sha256sum "${artifacts[@]}" > dist/SHA256SUMS

      - name: Prove the tripwire still fails closed
        if: github.event_name == 'pull_request'
        run: |
          if MINTMARK_CANARY='not-the-canary' uv run python tools/canary.py . ; then
            echo "tools/canary.py accepted a wrong canary"
            exit 1
          fi
          if env -u MINTMARK_CANARY uv run python tools/canary.py . ; then
            echo "tools/canary.py accepted a missing canary"
            exit 1
          fi
          echo "The tripwire fails closed; the tree is scanned on the push to main." >> "$GITHUB_STEP_SUMMARY"
