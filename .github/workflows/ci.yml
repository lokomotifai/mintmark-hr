# Required checks. Every job here runs offline after dependency bootstrap,
# against the core wheel vendored under vendor/. Any job needing network at run
# time belongs in core-pin.yml, labeled as such.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: packcheck, tests, prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"
      - name: Verify the vendored core before trusting it
        run: |
          cd vendor && shasum -a 256 -c CHECKSUMS
      - run: uv sync --locked
      - name: Conformance run against the pinned core
        run: uv run mintmark packcheck .
      - run: uv run pytest -ra
      - run: uv run python tools/mdlint.py .

  canary:
    name: private-corpus canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv sync --locked

      # The scan needs the canary, and GitHub does not give repository secrets to
      # a workflow triggered by a pull request from a fork. The old arrangement
      # ran the scan on every pull request anyway, so the required check failed on
      # every external contribution, and the only shape that would have fixed it,
      # pull_request_target, hands the secret to code the fork controls. Neither
      # is acceptable, so the scan runs where the secret exists: on the push to
      # main, which is the last point before anything is published.
      - name: Scan tree for private-corpus canary
        if: github.event_name == 'push'
        env:
          MINTMARK_CANARY: ${{ secrets.MINTMARK_CANARY }}
        run: uv run python tools/canary.py .

      # A pull request cannot run the scan, so it proves the tripwire is still
      # armed instead: the scanner has to refuse a wrong canary and a missing one.
      # That is the property a change to tools/canary.py could quietly remove, and
      # it is checkable without the secret.
      - name: Prove the tripwire still fails closed
        if: github.event_name == 'pull_request'
        run: |
          if MINTMARK_CANARY='not-the-canary' uv run python tools/canary.py . ; then
            echo "tools/canary.py accepted a canary that does not match the committed digest"
            exit 1
          fi
          if env -u MINTMARK_CANARY uv run python tools/canary.py . ; then
            echo "tools/canary.py accepted a missing canary"
            exit 1
          fi
          echo "The tripwire refuses a wrong canary and a missing one." >> "$GITHUB_STEP_SUMMARY"
          echo "The tree itself is scanned on the push to main that follows the merge." >> "$GITHUB_STEP_SUMMARY"
