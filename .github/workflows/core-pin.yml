# Network-separated provenance check for the executable core vendored by this pack.
name: core pin (network)

on:
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    name: vendored core matches immutable source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify repository-local wheel integrity
        run: cd vendor && sha256sum --check CHECKSUMS

      - name: Check out the independently governed core revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lokomotifai/mintmark
          ref: 499216efdc8d30ccb21d4a4a03a38b014b0ca870
          path: .core-source
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
          version: "0.12.3"

      - name: Rebuild the pinned source and compare exact wheel bytes
        run: |
          set -euo pipefail
          uv build --directory .core-source --out-dir "$RUNNER_TEMP/core-dist"
          expected="$(awk '{print $1}' vendor/CHECKSUMS)"
          filename="$(awk '{print $2}' vendor/CHECKSUMS)"
          actual="$(sha256sum "$RUNNER_TEMP/core-dist/$filename" | awk '{print $1}')"
          test "$actual" = "$expected"
          echo "Pinned core source reproduced $filename at $actual." >> "$GITHUB_STEP_SUMMARY"
