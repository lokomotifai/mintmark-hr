[project]
name = "mintmark-hr"
version = "0.1.0"
description = "Synthetic Turkish HR and payroll records with span-labeled employment documents."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"

# This repository ships no Python package. The project table exists so that uv
# can manage a test environment; there is nothing here to build or install.
[dependency-groups]
dev = [
  "mintmark",
  "pytest>=8.3,<10",
  "pyyaml>=6.0,<7",
  "ruff>=0.14,<0.17",
]

[tool.uv.sources]
# Required CI runs offline against the vendored wheel, whose SHA-256 is recorded
# in vendor/CHECKSUMS and confirmed against the core repository by a separated,
# network-labeled workflow.
mintmark = { path = "vendor/mintmark-0.1.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PT", "RET", "SIM", "PTH", "RUF"]

# Turkish letters are this project's subject matter, not a homoglyph attack.
allowed-confusables = ["ı", "İ", "ş", "Ş", "ğ", "Ğ", "ü", "Ü", "ö", "Ö", "ç", "Ç", "â", "î", "û"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
